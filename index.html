<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Country Nepal</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="flag">
      <section class="section flag-end">
        <img class="himal-img" src="/public/himal.svg" alt="" />
        <img class="pahad-img" src="/public/pahad.svg" alt="" />
        <img class="terai-img" src="/public/terai.svg" alt="" />
        <div class="slogan">
          HIMAL, PAHAD, TERAI <br />
          <span>No one is foreign in Nepal</span>
        </div>
      </section>
      <section class="section first-triangle">
        <div class="triangle-image himal"></div>
        <img class="symbol himal" src="/public/himal.svg" alt="" />
      </section>
      <section class="section second-triangle">
        <div class="triangle-image pahad"></div>
        <img class="symbol pahad" src="/public/pahad.svg" alt="" />
      </section>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
