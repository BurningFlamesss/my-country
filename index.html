<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Nepal</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="flag">
        <section class="section first-triangle">
            <img class="bg-image himal" src="/public/himal.svg" alt="" />
            <img class="symbol moon" src="/public/moon.svg" alt="" />
        </section>
        <section class="section second-triangle">
            <img class="bg-image pahad" src="/public/pahad.svg" alt="" />
            <img class="symbol sun" src="/public/sun.svg" alt="" />
        </section>
        <section class="section the-final-part">
            <img class="bg-image terai" src="/public/terai.svg" alt="" />
            <div class="slogan">
                HIMAL, PAHAD, TERAI <br />
                <span>ABA KOI CHAINA PARAI</span>
            </div>
        </section>
    </main>

    <script src="/script.js"></script>
</body>
</html>
